name: Build iOS (TestFlight)

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GeneralsMD/**'
      - 'GeneralsZH/**'
      - 'Core/**'
      - 'ios/**'
      - 'fastlane/**'
      - 'scripts/build/ios/**'

jobs:
  build-ios:
    name: iOS arm64 → TestFlight
    runs-on: [self-hosted, macos]
    timeout-minutes: 180

    env:
      GX_BUNDLE_ID: com.aaron.generalszh
      GX_TEAM_ID: LMFTNJ7TE4
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'ffc071e0c08432c60c9b64f003334c0227667931'

      - name: Install build dependencies
        run: |
          brew update
          brew install cmake ninja meson pkg-config glslang sdl3 \
            autoconf autoconf-archive automake libtool ffmpeg \
            freetype fontconfig
          which xcodegen || brew install xcodegen

      - name: Install Vulkan SDK (iOS MoltenVK xcframework)
        run: |
          VULKAN_ZIP="/tmp/vulkansdk-macos-1.4.341.1.zip"
          VULKAN_URL="https://sdk.lunarg.com/sdk/download/1.4.341.1/mac/vulkansdk-macos-1.4.341.1.zip"
          EXPECTED_SHA="632cbe96c8ed6ed00c6ce25e3a7738c466134f765866e1c51f141941 0d7f9042e"
          curl -L --max-time 120 --retry 2 -o "$VULKAN_ZIP" "$VULKAN_URL"
          VULKAN_APP=$(find /tmp -name "*.app" -path "*/vulkan*" -type d 2>/dev/null | head -1)
          mkdir -p /tmp/vulkan-extract
          unzip -q "$VULKAN_ZIP" -d /tmp/vulkan-extract
          VULKAN_APP=$(find /tmp/vulkan-extract -name "*.app" -type d | head -1)
          INSTALLER=$(find "$VULKAN_APP/Contents/MacOS" -name "vulkansdk-macOS-*" -type f | head -1)
          "$INSTALLER" --root "$HOME/VulkanSDK/1.4.341.1" \
            --accept-licenses --default-answer --confirm-command install
          echo "VULKAN_SDK=$HOME/VulkanSDK/1.4.341.1/macOS" >> "$GITHUB_ENV"
          rm -rf /tmp/vulkan-extract "$VULKAN_ZIP"

      - name: Install fastlane
        run: |
          gem install bundler --no-document 2>/dev/null || true
          bundle install --jobs 4 --retry 3

      - name: Build + upload to TestFlight
        env:
          VULKAN_SDK: ${{ env.VULKAN_SDK }}
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: bundle exec fastlane beta
