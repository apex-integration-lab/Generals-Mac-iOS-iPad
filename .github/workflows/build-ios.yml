name: iOS release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: Upload a new TestFlight build or submit a processed build to App Store review
        required: true
        default: testflight
        type: choice
        options:
          - testflight
          - appstore
      app_version:
        description: Marketing version already configured in App Store Connect
        required: true
        default: "1.04"
        type: string
      build_number:
        description: Processed TestFlight build number (required only for appstore)
        required: false
        type: string
      automatic_release:
        description: Release automatically after App Review approval (appstore only)
        required: true
        default: false
        type: boolean

jobs:
  build-ios:
    name: iOS ${{ inputs.release_target }}
    # This repository is public, so GitHub-hosted macOS capacity is available
    # without requiring an always-online organization runner.
    runs-on: macos-latest
    timeout-minutes: 180

    env:
      GX_BUNDLE_ID: com.aaron.generalszh
      GX_TEAM_ID: LMFTNJ7TE4
      GX_APP_VERSION: ${{ inputs.app_version }}
      GX_BUILD_NUMBER: ${{ github.run_number }}
      GX_RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
      GX_AUTOMATIC_RELEASE: ${{ inputs.automatic_release }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore Homebrew downloads
        if: inputs.release_target == 'testflight'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-${{ hashFiles('.github/workflows/build-ios.yml') }}
          restore-keys: |
            homebrew-${{ runner.os }}-

      - name: Restore C/C++ compiler cache
        if: inputs.release_target == 'testflight'
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ios-ccache-${{ runner.os }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'vcpkg-lock.json') }}
          restore-keys: |
            ios-ccache-${{ runner.os }}-

      - name: Create a short-lived Match repository token
        id: match-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MATCH_GITHUB_APP_ID }}
          private-key: ${{ secrets.MATCH_GITHUB_APP_PRIVATE_KEY }}
          owner: apex-integration-lab
          repositories: ios-match

      - name: Configure Match repository access
        run: |
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$(printf 'x-access-token:%s' "$MATCH_TOKEN" | base64 | tr -d '\n')" >> "$GITHUB_ENV"
        env:
          MATCH_TOKEN: ${{ steps.match-token.outputs.token }}

      - name: Setup vcpkg
        if: inputs.release_target == 'testflight'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '8f57207a8a1b96a4a864e11f85d57b0a252b3ac3'
          doNotCache: false

      - name: Install build dependencies
        if: inputs.release_target == 'testflight'
        run: |
          brew update
          brew install cmake ninja meson pkg-config glslang sdl3 \
            autoconf autoconf-archive automake libtool ffmpeg \
            freetype fontconfig ccache
          which xcodegen || brew install xcodegen

      - name: Install Vulkan SDK (iOS MoltenVK xcframework)
        if: inputs.release_target == 'testflight'
        run: |
          VULKAN_ZIP="/tmp/vulkansdk-macos-1.4.341.1.zip"
          VULKAN_URL="https://sdk.lunarg.com/sdk/download/1.4.341.1/mac/vulkansdk-macos-1.4.341.1.zip"
          EXPECTED_SHA="632cbe96c8ed6ed00c6ce25e3a7738c466134f765866e1c51f141941 0d7f9042e"
          curl -L --max-time 120 --retry 2 -o "$VULKAN_ZIP" "$VULKAN_URL"
          VULKAN_APP=$(find /tmp -name "*.app" -path "*/vulkan*" -type d 2>/dev/null | head -1)
          mkdir -p /tmp/vulkan-extract
          unzip -q "$VULKAN_ZIP" -d /tmp/vulkan-extract
          VULKAN_APP=$(find /tmp/vulkan-extract -name "*.app" -type d | head -1)
          INSTALLER=$(find "$VULKAN_APP/Contents/MacOS" -name "vulkansdk-macOS-*" -type f | head -1)
          "$INSTALLER" --root "$HOME/VulkanSDK/1.4.341.1" \
            --accept-licenses --default-answer --confirm-command install
          echo "VULKAN_SDK=$HOME/VulkanSDK/1.4.341.1/macOS" >> "$GITHUB_ENV"
          rm -rf /tmp/vulkan-extract "$VULKAN_ZIP"

      - name: Install fastlane
        run: |
          gem install bundler --no-document 2>/dev/null || true
          bundle install --jobs 4 --retry 3

      - name: Build + upload to TestFlight
        if: inputs.release_target == 'testflight'
        env:
          VULKAN_SDK: ${{ env.VULKAN_SDK }}
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: bundle exec fastlane beta

      - name: Submit processed TestFlight build to App Store review
        if: inputs.release_target == 'appstore'
        run: bundle exec fastlane submit_appstore
